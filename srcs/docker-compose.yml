services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: unless-stopped
    init: true
    volumes:
      - wordpress-db:/var/lib/mysql
    env_file:
      - .env
    environment:
      - DB_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
      - DB_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    expose:
      - "3306"
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: unless-stopped
    init: true
    depends_on:
      - mariadb
    env_file:
      - .env
    environment:
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - WORDPRESS_ADMIN_PASSWORD_FILE=/run/secrets/wordpress_admin_password
      - WORDPRESS_USER_PASSWORD_FILE=/run/secrets/wordpress_user_password
    secrets:
      - db_password
      - wordpress_admin_password
      - wordpress_user_password
    expose:
      - "9000"
    volumes:
      - wordpress_site:/var/www/html
    networks:
      - inception

volumes:
  wordpress-db:
    driver: local
  wordpress_site:
    driver: local

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wordpress_admin_password:
    file: ../secrets/wordpress_admin_password.txt
  wordpress_user_password:
    file: ../secrets/wordpress_user_password.txt

networks:
  inception:
    driver: bridge
